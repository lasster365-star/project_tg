<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Магазин</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Назад">←</button>
      <h1 id="title">Магазин</h1>
      <button id="cartBtn" class="icon-btn" aria-label="Корзина">🛒</button>
    </header>

    <main id="screen"></main>

    <nav class="bottombar">
      <button data-tab="shop">🛍<span>Магазин</span></button>
      <button data-tab="cart">🛒<span>Корзина</span></button>
      <button data-tab="profile">👤<span>Кабинет</span></button>
      <button data-tab="support">💬<span>Поддержка</span></button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
